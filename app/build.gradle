plugins {
    id 'com.android.application'
}

// Release signing is configured out of tree: keystore.properties (gitignored)
// or the matching HK_* environment variables. Neither the keystore nor its
// password belongs in the repository. Without either, the release build is
// simply left unsigned, so a clean clone still builds.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signStoreFile = keystoreProps.getProperty('storeFile') ?: System.getenv('HK_STORE_FILE')
def signStorePassword = keystoreProps.getProperty('storePassword') ?: System.getenv('HK_STORE_PASSWORD')
def signKeyAlias = keystoreProps.getProperty('keyAlias') ?: System.getenv('HK_KEY_ALIAS')
def signKeyPassword = keystoreProps.getProperty('keyPassword') ?: System.getenv('HK_KEY_PASSWORD')
def canSign = signStoreFile != null && file(signStoreFile).exists()

android {
    namespace 'org.pocketworkstation.pckeyboard'
    compileSdk 36
    // r28+ links native libraries with 16 KB-aligned segments by default, which
    // Android 15+ devices with 16 KB pages require. AGP's default NDK (r27) still
    // emits 4 KB alignment, so this is pinned rather than left implicit.
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'org.pocketworkstation.pckeyboard'
        // AndroidX and the modern toolchain require API 21 as a floor. Everything
        // above that is still supported; nothing in this app needs a higher minimum.
        minSdk 21
        targetSdk 36
        // Upstream v1.41.1 plus the hardening work on this branch. The code is
        // bumped so a later hardened build installs over this one.
        versionCode 1041002
        versionName "v1.41.1-hardened.1"

        externalNativeBuild {
            cmake {
                // Hardening for the dictionary parser (HK-01). _FORTIFY_SOURCE is
                // only effective with optimisation, which release builds enable.
                cppFlags '-fstack-protector-strong', '-D_FORTIFY_SOURCE=2', '-Wall'
            }
        }
    }

    signingConfigs {
        release {
            if (canSign) {
                storeFile file(signStoreFile)
                storePassword signStorePassword
                keyAlias signKeyAlias
                keyPassword signKeyPassword
                // v1 for API 21-23, v2/v3 for everything newer. v3 is what
                // supports key rotation, so it is worth having from the start.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            if (canSign) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('No signing config found; the release APK will be unsigned '
                        + 'and cannot be installed. See keystore.properties.')
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            // Keep the debug variant unshrunk so stack traces stay readable.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            // Required for 16 KB page-size devices (Android 15+).
            useLegacyPackaging false
        }
    }

    lint {
        // The security-relevant checks must not be silently skipped.
        abortOnError false
        checkReleaseBuilds true
        warningsAsErrors false
    }
}

dependencies {
    // Pinned explicitly rather than a wildcard fileTree, so a JAR dropped into
    // libs/ cannot silently enter the build (HK-09). Provenance and SHA-256 are
    // recorded in app/libs/README.md.
    implementation files('libs/voiceimeutils.jar')

    // Only androidx.core is needed: the activities extend the framework classes
    // directly, so appcompat would be dead weight. Used for NotificationCompat,
    // NotificationManagerCompat and window-inset handling.
    implementation 'androidx.core:core:1.17.0'
}
