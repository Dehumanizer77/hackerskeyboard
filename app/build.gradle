plugins {
    id 'com.android.application'
}

android {
    namespace 'org.pocketworkstation.pckeyboard'
    compileSdk 36
    // r28+ links native libraries with 16 KB-aligned segments by default, which
    // Android 15+ devices with 16 KB pages require. AGP's default NDK (r27) still
    // emits 4 KB alignment, so this is pinned rather than left implicit.
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'org.pocketworkstation.pckeyboard'
        // AndroidX and the modern toolchain require API 21 as a floor. Everything
        // above that is still supported; nothing in this app needs a higher minimum.
        minSdk 21
        targetSdk 36
        versionCode 1041001
        versionName "v1.41.1"

        externalNativeBuild {
            cmake {
                // Hardening for the dictionary parser (HK-01). _FORTIFY_SOURCE is
                // only effective with optimisation, which release builds enable.
                cppFlags '-fstack-protector-strong', '-D_FORTIFY_SOURCE=2', '-Wall'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            // Keep the debug variant unshrunk so stack traces stay readable.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            // Required for 16 KB page-size devices (Android 15+).
            useLegacyPackaging false
        }
    }

    lint {
        // The security-relevant checks must not be silently skipped.
        abortOnError false
        checkReleaseBuilds true
        warningsAsErrors false
    }
}

dependencies {
    // Pinned explicitly rather than a wildcard fileTree, so a JAR dropped into
    // libs/ cannot silently enter the build (HK-09). Provenance and SHA-256 are
    // recorded in app/libs/README.md.
    implementation files('libs/voiceimeutils.jar')

    // Only androidx.core is needed: the activities extend the framework classes
    // directly, so appcompat would be dead weight. Used for NotificationCompat,
    // NotificationManagerCompat and window-inset handling.
    implementation 'androidx.core:core:1.17.0'
}
