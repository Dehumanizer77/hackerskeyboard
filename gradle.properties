# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX replaces the frozen com.android.support libraries.
android.useAndroidX=true
android.nonTransitiveRClass=true
# The keyboard view classes switch() over R.styleable constants, which requires
# final R fields. AGP 8 defaults this to true; the app module needs the old
# behaviour rather than a mechanical rewrite of those switch statements.
android.nonFinalResIds=false
